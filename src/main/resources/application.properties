# 本地贷款服务配置（仅本地内存账本，不依赖外部服务/凭据）
# 宽限期天数：到期日 + graceDays 当天仍不算逾期，次日起算
loan.servicing.grace-days=3
# 日计息口径：ACT_365_FIXED 或 ACT_360
loan.servicing.day-count=ACT_365_FIXED
# 业务日切小时：提交时刻小时 >= 该值归属当日，否则归属前一自然日
loan.servicing.cutoff-hour=0
# 年罚息利率
loan.servicing.annual-penalty-rate=0.18
# 宽限截止日落周末是否顺延至下一工作日
loan.servicing.extend-overdue-to-business-day=false
